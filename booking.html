<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預約確認單 · 小玩的心靈牌卡占卜</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFFFFF;
    --parchment: #FFF9E6;
    --gold: #F5C200;
    --gold-dark: #8A6C00;
    --gold-light: #FFF3B0;
    --charcoal: #1A1500;
    --text-muted: #6B5E20;
    --border-light: rgba(220,170,0,0.18);
    --border-med: rgba(220,170,0,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--parchment);
    color: var(--charcoal);
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.75;
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  header {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border-light);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    position: sticky; top: 0; z-index: 10;
  }
  header img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  header a {
    font-family: 'Noto Serif TC', serif;
    font-size: 0.82rem;
    color: var(--gold-dark);
    text-decoration: none;
    letter-spacing: 0.1em;
  }
  header a:hover { color: var(--charcoal); }

  /* ─── HERO ─── */
  .form-hero {
    text-align: center;
    padding: 3.5rem 1.5rem 2rem;
  }
  .form-hero .eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .form-hero h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    font-weight: 300;
    color: var(--charcoal);
    letter-spacing: 0.06em;
    margin-bottom: 0.6rem;
  }
  .form-hero h1 em { font-style: normal; color: var(--gold-dark); }
  .form-hero p {
    font-size: 0.82rem;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ─── FORM CARD ─── */
  .form-wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 1.2rem 4rem;
  }

  .form-card {
    background: #FFFFFF;
    border: 1px solid var(--border-med);
    border-radius: 12px;
    padding: 2.2rem 2.4rem;
  }

  .form-section-label {
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    margin-top: 2rem;
    padding-bottom: 0.5rem;
    border-bottom: 0.5px solid var(--border-light);
  }
  .form-section-label:first-child { margin-top: 0; }

  .form-group {
    margin-bottom: 1.3rem;
  }
  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 400;
    color: var(--charcoal);
    margin-bottom: 0.4rem;
    letter-spacing: 0.03em;
  }
  label span.required {
    color: var(--gold);
    margin-left: 0.2rem;
    font-size: 0.75rem;
  }
  label span.hint {
    color: var(--text-muted);
    font-size: 0.72rem;
    font-weight: 300;
    margin-left: 0.4rem;
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  input[type="number"],
  select,
  textarea {
    width: 100%;
    padding: 0.65rem 1rem;
    border: 1px solid var(--border-med);
    border-radius: 8px;
    background: #FDFBF0;
    color: var(--charcoal);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.88rem;
    font-weight: 300;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(245,194,0,0.12);
    background: #FFFFFF;
  }

  /* 聯絡方式 row */
  .contact-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 0.6rem;
    align-items: start;
  }
  .contact-row select { width: 100%; }

  /* 自訂 select arrow */
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 0.9rem; top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 0.75rem;
    pointer-events: none;
  }

  /* 數字選單 row */
  .number-row {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .number-row .select-wrap { width: 120px; }
  .number-row p {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.6;
    flex: 1;
  }

  textarea { resize: vertical; min-height: 100px; line-height: 1.8; }

  /* 轉帳資訊 */
  .transfer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }

  /* 提示框 */
  .info-box {
    background: var(--gold-light);
    border: 1px solid rgba(245,194,0,0.3);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    font-size: 0.78rem;
    color: var(--gold-dark);
    line-height: 1.8;
    margin-bottom: 1.5rem;
  }
  .info-box strong { color: var(--charcoal); }

  /* 送出按鈕 */
  .submit-btn {
    width: 100%;
    padding: 0.9rem;
    margin-top: 1.8rem;
    background: var(--gold);
    color: var(--charcoal);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .submit-btn:hover { background: #E0B000; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(245,194,0,0.3); }

  /* 成功訊息 */
  .success-msg {
    display: none;
    text-align: center;
    padding: 2.5rem 1.5rem;
  }
  .success-msg .icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .success-msg h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.2rem;
    font-weight: 300;
    color: var(--charcoal);
    margin-bottom: 0.5rem;
  }
  .success-msg p { font-size: 0.82rem; color: var(--text-muted); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 480px) {
    .form-card { padding: 1.5rem 1.3rem; }
    .transfer-grid { grid-template-columns: 1fr; }
    .contact-row { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="logo">
  <a href="index.html">← 返回官網</a>
</header>

<div class="form-hero">
  <div class="eyebrow">預約確認</div>
  <h1>占卜<em>預約確認單</em></h1>
  <p>請於完成匯款後填寫此表單，小玩收到後將為你確認預約 🔮</p>
</div>

<div class="form-wrap">
  <form id="bookingForm" action="https://formspree.io/f/mgodyveo" method="POST">

    <!-- 基本資料 -->
    <div class="form-card">
      <div class="form-section-label">基本資料</div>

      <div class="form-group">
        <label>暱稱 <span class="required">✦</span></label>
        <input type="text" name="暱稱" placeholder="你的名字或暱稱" required>
      </div>

      <div class="form-group">
        <label>聯絡方式 <span class="required">✦</span></label>
        <div class="contact-row">
          <div class="select-wrap">
            <select name="聯絡平台" required>
              <option value="">選擇平台</option>
              <option value="Instagram">Instagram</option>
              <option value="LINE">LINE</option>
            </select>
          </div>
          <input type="text" name="聯絡帳號" placeholder="輸入帳號 ID" required>
        </div>
      </div>

      <!-- 數字 -->
      <div class="form-group">
        <label>內心想一個數字 <span class="required">✦</span></label>
        <div class="number-row">
          <div class="select-wrap">
            <select name="心中數字" required>
              <option value="">選擇</option>
              <!-- JS 生成 01-99 -->
            </select>
          </div>
          <p>閉上眼睛，心中浮現的第一個數字是？</p>
        </div>
      </div>

      <!-- 占卜類型 -->
      <div class="form-section-label">預約內容</div>

      <div class="form-group">
        <label>占卜方案 <span class="required">✦</span></label>
        <div class="select-wrap">
          <select name="占卜方案" required>
            <option value="">請選擇</option>
            <option value="一對一線上占卜">一對一線上占卜</option>
            <option value="一對一實體占卜">一對一實體占卜</option>
            <option value="離線占卜｜單題占卜">離線占卜 ｜ 單題占卜</option>
            <option value="離線占卜｜指引占卜">離線占卜 ｜ 指引占卜</option>
            <option value="離線占卜｜選擇牌陣">離線占卜 ｜ 選擇牌陣</option>
            <option value="離線占卜｜感情牌陣">離線占卜 ｜ 感情牌陣</option>
            <option value="離線占卜｜事業牌陣">離線占卜 ｜ 事業牌陣</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="datetimeGroup">
        <label>預約日期 ／ 時間 <span class="required">✦</span><span class="hint">（離線占卜選匯款日期即可）</span></label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;">
          <input type="date" name="預約日期" required>
          <input type="time" name="預約時間">
        </div>
      </div>

      <div class="form-group">
        <label>占卜問題 ／ 想詢問的方向 <span class="required">✦</span></label>
        <div style="margin-bottom: 0.5rem; font-size: 0.75rem; color: #C05050; line-height: 1.8;">
          ⚠ 為了保持占卜的客觀性，只需告知問題即可，不需分享事件現況或個人想法，避免干擾牌面解讀。
        </div>
        <textarea name="占卜問題" placeholder="請告知你的問題，開放式問法為佳（例：這三個月的感情發展如何？）" required></textarea>
      </div>

      <!-- 匯款資訊 -->
      <div class="form-section-label">匯款資訊</div>

      <div class="info-box">
        須完成匯款後預約才算成功。<br>
        <strong>永豐銀行（807）帳號：20201800885109</strong>
      </div>

      <div class="transfer-grid">
        <div class="form-group">
          <label>匯款金額 <span class="required">✦</span></label>
          <input type="text" name="匯款金額" placeholder="例：2100" required>
        </div>
        <div class="form-group">
          <label>帳號末五碼 <span class="required">✦</span></label>
          <input type="text" name="帳號末五碼" placeholder="例：12345" maxlength="5" required>
        </div>
      </div>

      <div class="form-group">
        <label>匯款時間 <span class="required">✦</span></label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem;">
          <input type="date" name="匯款日期" required>
          <input type="time" name="匯款時間">
        </div>
      </div>

      <button type="submit" class="submit-btn">送出預約確認單 ✦</button>
    </div>

    <!-- 成功訊息 -->
    <div class="success-msg" id="successMsg">
      <div class="icon">🔮</div>
      <h2>預約確認單已送出！</h2>
      <p>小玩收到後將盡快與你確認，請留意私訊通知。</p>
    </div>

  </form>
</div>

<script>
  // 生成 01-99 選項
  const select = document.querySelector('select[name="心中數字"]');
  for (let i = 1; i <= 99; i++) {
    const opt = document.createElement('option');
    opt.value = String(i).padStart(2, '0');
    opt.textContent = String(i).padStart(2, '0');
    select.appendChild(opt);
  }

  // 表單送出
  const form = document.getElementById('bookingForm');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = form.querySelector('.submit-btn');
    btn.textContent = '送出中⋯';
    btn.disabled = true;

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.querySelector('.form-card').style.display = 'none';
        document.getElementById('successMsg').style.display = 'block';
      } else {
        btn.textContent = '送出失敗，請重試';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = '送出失敗，請重試';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
